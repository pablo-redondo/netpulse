services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: netpulse
      POSTGRES_PASSWORD: netpulse
      POSTGRES_DB: netpulse
    ports:
      - "5432:5432"
    volumes:
      - netpulse_postgres_data:/var/lib/postgresql/data

volumes:
  netpulse_postgres_data:
